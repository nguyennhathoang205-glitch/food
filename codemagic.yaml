workflows:
  ios-unsigned:
    name: FoodScan AI iOS (khong ky)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        # Dia chi Hugging Face Space cua ban (khong co dau / o cuoi)
        API_BASE_URL: "https://quangdadada-foodscan-api.hf.space"
    scripts:
      - name: Cai thu vien
        script: cd mobile && flutter pub get
      - name: Build iOS khong ky
        script: |
          cd mobile && flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL=$API_BASE_URL
      - name: Dong goi IPA
        script: |
          cd mobile
          rm -rf Payload FoodScanAI.ipa
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry FoodScanAI.ipa Payload
    artifacts:
      - mobile/FoodScanAI.ipa
